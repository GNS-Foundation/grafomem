[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Deploy only when a changed file matches. Every entry below is an input to the
# built image or to the build/deploy config itself — derived from the Dockerfile's
# COPY lines (23-27), not guessed. Anything the image consumes and this list omits
# would silently stop triggering deploys, leaving production stale against main.
#   src/                → COPY src/ src/                     (the application)
#   adapter_template/   → COPY adapter_template/ ...
#   corpus/             → COPY corpus/ corpus/               (conformance corpus)
#   tests/              → COPY tests/ tests/                 (see note below)
#   pyproject.toml      → COPY pyproject.toml README.md ./   (deps + package-data)
#   README.md           → same COPY; pyproject reads it at build time
#   Dockerfile          → the build recipe
#   railway.toml        → this file
# NOTE: tests/ is listed because the Dockerfile copies it INTO the runtime image
# (lines 27 and 50), so a test-only change genuinely changes the artefact. If that
# copy is removed, drop tests/ from this list in the same change.
watchPatterns = [
    "src/**",
    "adapter_template/**",
    "corpus/**",
    "tests/**",
    "pyproject.toml",
    "README.md",
    "Dockerfile",
    "railway.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# A1 (schema-drift audit): schema DDL is a pre-deploy release step, not boot work.
# Runs ensure_schema (the base tables) then pending migrations, as the migrate role
# ($GRAFOMEM_MIGRATE_URL). A non-zero exit BLOCKS the deploy — old version keeps
# serving. Cloud boot does no DDL (create_app gates ensure_schema off in cloud).
# After schema/migrations, backfill tenant_api_keys.api_key_hash (hash-at-rest, DARK — auth still
# reads plaintext). Runner-side HMAC; the pepper (GRAFOMEM_API_KEY_PEPPER) is never put in SQL.
# --skip-if-no-pepper keeps a pepper-less environment dark instead of blocking the deploy; where the
# pepper IS set (staging/prod), it runs and populates hashes. A hard failure still blocks the deploy.
preDeployCommand = "python -m aml.cloud.migrations_runner --ensure-schema && python scripts/backfill_api_key_hash.py --skip-if-no-pepper"

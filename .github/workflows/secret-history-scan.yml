# Scheduled FULL-HISTORY secret scan.
#
# The per-PR `secret-scan` job (ci.yml) scans the full working tree at HEAD. This job scans the
# entire git HISTORY — every commit — because a secret that was committed and later deleted from
# HEAD is gone from the tree scan but still disclosed in history (exactly what happened with the
# rotated prod Postgres credential in five scratch scripts).
#
# History's already-known DEAD secrets are filtered by a COMMITTED BASELINE (.gitleaks-baseline.json)
# that pins each known finding by fingerprint (commit:file:rule:startline). The baseline exempts
# ONLY those exact findings — it is NOT a path/file/blanket-history exemption. A NEW secret, even in
# an old file, lands in a NEW commit and therefore a NEW fingerprint that is not in the baseline, so
# it still fails this job. See docs/runbooks and .gitleaks-baseline.json's generation note.
name: secret-history-scan

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history is the whole point

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Full-history scan (baseline-filtered — fails only on NEW findings)
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --report-path gitleaks-history-report.json \
            --no-banner --redact --exit-code 1

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore
